name: Build-Test
# Run this workflow every time a new commit pushed to your repository
on: push

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  build-test:
    name: Build Test (ROS1 Noetic)
    runs-on: ubuntu-22.04
    container: ros:noetic
    
    defaults:
      run:
        shell: bash -l {0}

    steps:
      # Run package update
      - name: Run package update
        run: |
          apt update
          apt dist-upgrade -y

      # Ensure Git is installed for submodules support
      - name: Install Git
        run: |
          apt-get install -y git

      # Install dependencies
      - name: Install dependencies
        run: |
          apt-get install -y g++ cmake libpopt-dev \
            liblua5.1-dev libeigen3-dev \
            libjpeg8-dev libgoogle-perftools-dev \
            libsuitesparse-dev libblas-dev liblapack-dev libopenmpi-dev \
            libgoogle-glog-dev libgflags-dev libceres-dev libtbb-dev \
            ros-noetic-xmlrpcpp python-is-python3 \
            python3-rosdep python3-rosinstall python3-rosinstall-generator python3-wstool build-essential \
            ros-noetic-tf ros-noetic-angles ros-noetic-tf2-geometry-msgs

      # ROSDep
      - name: ROSDep Update
        run: |
          rm -f /etc/ros/rosdep/sources.list.d/20-default.list || true
          rosdep init || true
          rosdep update

      # Checks out a copy of your repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Checkout and build amrl_msgs
      - name: Get amrl_msgs
        run: |
          source /opt/ros/noetic/setup.bash
          export ROS_PACKAGE_PATH=$ROS_PACKAGE_PATH:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/../amrl_msgs
          cd $GITHUB_WORKSPACE/..
          git clone https://github.com/ut-amrl/amrl_msgs.git
          cd amrl_msgs
          make

      # Compiles the code
      - name: Run build
        run: |
          source /opt/ros/noetic/setup.bash
          export ROS_PACKAGE_PATH=$ROS_PACKAGE_PATH:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/../amrl_msgs
          cd $GITHUB_WORKSPACE
          make