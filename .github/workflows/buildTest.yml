name: Build-Test
on: push

jobs:
  build-test:
    name: Build test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install ROS 2 apt source
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | awk -F'"' '/tag_name/ {print $4}')
          curl -sSL -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")_all.deb"
          sudo apt-get install -y /tmp/ros2-apt-source.deb
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            build-essential g++ cmake git libpopt-dev \
            liblua5.2-dev libeigen3-dev \
            libjpeg-dev libgoogle-perftools-dev \
            libsuitesparse-dev libblas-dev liblapack-dev libopenmpi-dev \
            libgoogle-glog-dev libgflags-dev libceres-dev libtbb-dev \
            libncurses-dev \
            ros-jazzy-ros-base \
            ros-jazzy-ament-cmake \
            ros-jazzy-ament-index-cpp \
            ros-jazzy-rclcpp \
            ros-jazzy-std-msgs \
            ros-jazzy-nav-msgs \
            ros-jazzy-sensor-msgs \
            ros-jazzy-geometry-msgs \
            ros-jazzy-visualization-msgs \
            ros-jazzy-tf2 \
            ros-jazzy-tf2-geometry-msgs \
            ros-jazzy-rosbag2-cpp \
            ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-rosbag2-storage-sqlite3

      - name: Build amrl_msgs
        run: |
          source /opt/ros/jazzy/setup.bash
          cd "$GITHUB_WORKSPACE/.."
          git clone https://github.com/ut-amrl/amrl_msgs.git
          cd amrl_msgs
          ROS_VERSION=2 make

      - name: Build enml
        run: |
          source /opt/ros/jazzy/setup.bash
          export AMENT_PREFIX_PATH="$GITHUB_WORKSPACE/../amrl_msgs/install:$AMENT_PREFIX_PATH"
          export CMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/../amrl_msgs/install:$CMAKE_PREFIX_PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/../amrl_msgs/install/lib:$LD_LIBRARY_PATH"
          cd "$GITHUB_WORKSPACE"
          make